<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">E-Waste Compute Grid</title>
  <desc id="desc">Give usable retired laptops a second computing life. AWS coordinates independent batches; owner-approved laptops compute and return accountable results.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1"><stop stop-color="#071b20"/><stop offset="1" stop-color="#0d1527"/></linearGradient>
    <linearGradient id="accent" x2="1"><stop stop-color="#34d399"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0L0 0 0 32" fill="none" stroke="#83acb8" stroke-opacity=".055"/></pattern>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M0 0L7 4L0 8" fill="none" stroke="#58b7b0" stroke-width="1.5"/></marker>
  </defs>
  <rect width="1200" height="430" rx="20" fill="url(#background)"/>
  <rect width="1200" height="430" rx="20" fill="url(#grid)"/>
  <rect x="32" y="30" width="4" height="28" rx="2" fill="url(#accent)"/>
  <g font-family="Segoe UI, Arial, sans-serif">
    <text x="50" y="49" fill="#76ddba" font-size="13" font-weight="700" letter-spacing="2">ENVIRONMENTAL HACKS · TRACK 03 / WASTE AND ENERGY</text>
    <text x="46" y="113" fill="#f1f7fb" font-size="48" font-weight="750" letter-spacing="-1.5">E-Waste Compute Grid</text>
    <text x="49" y="151" fill="#bdcdda" font-size="22">A second computing life for usable retired laptops.</text>
    <rect x="48" y="192" width="300" height="164" rx="15" fill="#10252b" stroke="#2d5055"/>
    <text x="72" y="222" fill="#82e1bc" font-size="12" font-weight="700" letter-spacing="1.8">01 / REUSE</text>
    <g fill="none" stroke="#67d9b1" stroke-width="2.2">
      <rect x="75" y="239" width="54" height="33" rx="4"/><path d="M69 278h66l-5 5H74z"/>
      <rect x="157" y="239" width="54" height="33" rx="4"/><path d="M151 278h66l-5 5h-56z"/>
      <rect x="239" y="239" width="54" height="33" rx="4"/><path d="M233 278h66l-5 5h-56z"/>
    </g>
    <text x="72" y="316" fill="#f1f7fb" font-size="18" font-weight="600">Owner-approved laptops</text>
    <text x="72" y="339" fill="#9bb4c1" font-size="13">Local CPU + RAM · explicit limits</text>
    <path d="M362 274h51" stroke="#58b7b0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="428" y="192" width="344" height="164" rx="15" fill="#152330" stroke="#344f67"/>
    <text x="452" y="222" fill="#80bbff" font-size="12" font-weight="700" letter-spacing="1.8">02 / COORDINATE ON AWS</text>
    <rect x="452" y="242" width="124" height="42" rx="8" fill="#233341" stroke="#54626a"/>
    <text x="477" y="268" fill="#ffc775" font-size="16" font-weight="600">Amplify</text>
    <rect x="594" y="242" width="152" height="42" rx="8" fill="#233341" stroke="#54626a"/>
    <text x="637" y="268" fill="#ffc775" font-size="16" font-weight="600">EC2</text>
    <text x="452" y="316" fill="#f1f7fb" font-size="18" font-weight="600">Durable batch orchestration</text>
    <text x="452" y="339" fill="#9bb4c1" font-size="13">HTTPS · PostgreSQL · leases + retries</text>
    <path d="M786 274h51" stroke="#58b7b0" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="852" y="192" width="300" height="164" rx="15" fill="#182332" stroke="#3c5068"/>
    <text x="876" y="222" fill="#a7bdff" font-size="12" font-weight="700" letter-spacing="1.8">03 / RETURN USEFUL WORK</text>
    <g stroke="#82a9ee" stroke-width="3" stroke-linecap="round"><path d="M880 249l5 5 9-11" fill="none"/><path d="M905 250h65"/><path d="M880 270l5 5 9-11" fill="none"/><path d="M905 271h93"/></g>
    <text x="876" y="316" fill="#f1f7fb" font-size="18" font-weight="600">Accountable results</text>
    <text x="876" y="339" fill="#9bb4c1" font-size="13">Predictions · attribution · JSON export</text>
    <path d="M48 381h1104" stroke="#365064" stroke-opacity=".65"/>
    <text x="48" y="406" fill="#8fa7b8" font-size="13">THE CLOUD COORDINATES. THE LAPTOPS COMPUTE.</text>
    <text x="1152" y="406" fill="#77d3b4" font-size="13" text-anchor="end">Consent → Compute → Recover → Verify</text>
  </g>
</svg>
